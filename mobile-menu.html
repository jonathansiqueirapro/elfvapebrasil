<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Mobile — Elfbar Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="stylesheet" href="style.css">
<style>
/* ═══ MOBILE MENU OVERLAY ═══ */
.mobile-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,.5);
  opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.mobile-overlay.open { opacity: 1; pointer-events: auto; }

.mobile-menu {
  position: fixed; top: 0; left: 0; bottom: 0; z-index: 201;
  width: 320px; max-width: 85vw;
  background: var(--bg);
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
  box-shadow: 4px 0 24px rgba(0,0,0,.12);
}
.mobile-menu.open { transform: translateX(0); }

/* Header */
.mm-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--border-light);
  min-height: 52px;
}
.mm-header .mm-logo img { height: 24px; width: auto; display: block; }
.mm-close {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: var(--bg-secondary);
  border-radius: var(--radius-pill);
  cursor: pointer; color: var(--text);
  transition: background .15s;
}
.mm-close:hover { background: var(--border-light); }

/* Search */
.mm-search {
  padding: .75rem 1rem;
  border-bottom: 1px solid var(--border-light);
}
.mm-search-wrap { position: relative; }
.mm-search-wrap input {
  width: 100%; height: 40px;
  padding: 0 1rem 0 2.5rem;
  border: none; border-radius: var(--radius-pill);
  background: var(--bg-secondary);
  font-size: .875rem; font-family: var(--font);
  outline: none; transition: box-shadow .15s;
}
.mm-search-wrap input:focus { box-shadow: 0 0 0 1.5px var(--pink); }
.mm-search-icon {
  position: absolute; left: .75rem; top: 50%; transform: translateY(-50%);
  color: var(--text-tertiary);
}

/* Nav */
.mm-nav { flex: 1; overflow-y: auto; padding: .5rem 0; }
.mm-nav ul { list-style: none; margin: 0; padding: 0; }
.mm-nav li { margin: 0; padding: 0; }

.mm-nav a {
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1rem;
  font-size: .875rem; font-weight: 500; color: var(--text);
  text-decoration: none; transition: background .15s;
}
.mm-nav a:hover { background: var(--bg-secondary); }
.mm-nav-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.mm-nav-icon svg { width: 18px; height: 18px; color: var(--blue); }
.mm-nav .mm-label { flex: 1; }
.mm-nav .mm-arrow { color: var(--text-tertiary); }

.mm-divider {
  height: 1px; background: var(--border-light);
  margin: .5rem 1rem;
}

/* Pages section */
.mm-section-title {
  padding: .75rem 1rem .25rem;
  font-size: .6875rem; font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: .06em;
}

/* Footer */
.mm-footer {
  padding: 1rem;
  border-top: 1px solid var(--border-light);
}
.mm-whatsapp {
  display: flex; align-items: center; gap: .5rem;
  padding: .625rem .75rem;
  background: #25D366; color: #fff;
  border-radius: var(--radius-pill);
  text-decoration: none; font-size: .8125rem; font-weight: 600;
  transition: background .15s;
}
.mm-whatsapp:hover { background: #1DAE5A; color: #fff; }
.mm-whatsapp svg { width: 18px; height: 18px; }

/* Demo toggle button */
.demo-btn {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .75rem 1.5rem;
  background: var(--blue); color: #fff; border: none;
  border-radius: var(--radius-pill);
  font-size: .9375rem; font-weight: 600; font-family: var(--font);
  cursor: pointer; margin: 4rem auto 2rem;
  transition: background .15s;
}
.demo-btn:hover { background: #535de0; }
.demo-wrap { text-align: center; padding-top: 20vh; }

@media (width > 768px) {
  .demo-wrap { display: none; }
}
</style>
</head>

<!-- Demo button (shows on mobile) -->
<div class="demo-wrap">
  <p style="margin-bottom:1rem;color:var(--text-secondary);">Clique para abrir o menu mobile</p>
  <button class="demo-btn" onclick="openMenu()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    Abrir menu mobile
  </button>
</div>

<script>
function openMenu() {
  document.getElementById('mobileMenu').classList.add('open');
  document.getElementById('mobileOverlay').classList.add('open');
}
function closeMenu() {
  document.getElementById('mobileMenu').classList.remove('open');
  document.getElementById('mobileOverlay').classList.remove('open');
}
lucide.createIcons();
</script>
</body>
</html>
